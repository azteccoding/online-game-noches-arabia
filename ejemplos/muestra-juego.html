function salto(p,fase){const h=Math.abs(Math.sin(fase))*9,k=Math.cos(2*fase);p.cu.setAttribute('transform',`translate(0 ${-h}) translate(0 3) scale(${1.005+.045*k} ${.995-.055*k}) translate(0 -3)`);p.som.setAttribute('rx',20-h*.5);p.som.style.opacity=1-h*.04}
/* ---------- Rutas y viaje ---------- */
const adj={};D.rutas.forEach((r,i)=>{(adj[r[0]]||=[]).push([r[1],i,false]);(adj[r[1]]||=[]).push([r[0],i,true])});
const rp=i=>$('#p'+i);
function camino(a,b){const q=[a],prev={[a]:null};while(q.length){const x=q.shift();if(x===b)break;for(const[y,i,rv]of adj[x]||[])if(!(y in prev)){prev[y]=[x,i,rv];q.push(y)}}
if(!(b in prev))return null;const s=[];for(let x=b;prev[x];x=prev[x][0])s.unshift({i:prev[x][1],rv:prev[x][2]});return s}
let viajando=false;
function viajar(dest){const p=yo();if(viajando)return toast('Tu personaje ya va en camino.');if(dest===p.ciudad)return toast(`Ya estás en ${dest}.`);
const segs=camino(p.ciudad,dest);if(!segs)return toast('No hay camino hasta allí.');
const paths=segs.map(s=>rp(s.i)),lens=paths.map(x=>x.getTotalLength()),tot=lens.reduce((a,b)=>a+b,0);
let tarifa=0;segs.forEach(s=>{const r=D.rutas[s.i];tarifa+=(s.rv?r[3]:r[2])||0});
viajando=true;$('#bDados').disabled=$('#bCarta').disabled=true;segs.forEach(s=>$('#r'+s.i).classList.add('viva'));
const act=$(`.ciudad[data-c="${dest}"]`);act.classList.add('act');
const T=clamp(tot/560,1.3,3.6)*1000,t0=performance.now();seguir=true;let ult=t0;
(function paso(now){const t=Math.min(1,(now-t0)/T),d=tot*ease(t);let k=0,a=d;while(k<segs.length-1&&a>lens[k]){a-=lens[k];k++}
const q=paths[k].getPointAtLength(segs[k].rv?lens[k]-a:a);p.x=q.x;p.y=q.y;colocar(p);salto(p,t<1?d*v.z/38*Math.PI:0);
if(seguir){const dt=Math.min(.05,(now-ult)/1000);v.cx+=(p.x-v.cx)*Math.min(1,dt*3);v.cy+=(p.y-v.cy)*Math.min(1,dt*3);sched()}ult=now;
if(t<1)requestAnimationFrame(paso);else{p.ciudad=dest;[p.x,p.y]=D.ciu[dest];reparte();D.pj.forEach(colocar);seguir=false;viajando=false;
segs.forEach(s=>$('#r'+s.i).classList.remove('viva'));act.classList.remove('act');$('#bDados').disabled=$('#bCarta').disabled=false;
const paga=Math.min(p.din,tarifa);p.din-=paga;stats(true);log(`${yo().jug} viaja a ${dest}${paga?` y paga ${paga} dinares de caravana`:''}.`);toast(`Llegas a ${dest}`);pintaPers()}})(t0);
}
/* ---------- Estado, registro y avisos ---------- */
const fmt=n=>n.toLocaleString('es-ES');
function stats(b){$('#sDin').textContent=yo().din;$('#sNoc').textContent=fmt(yo().noc);$('#metaBar').style.width=Math.min(100,yo().noc/10.01)+'%';$('#cNoc').parentNode.querySelector('.meta').setAttribute('aria-valuenow',yo().noc);
if(b){const e=$('#cDin');e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}}
const REG=['Ronda 3: es el turno de Jorge.','Carolina llegó a Bagdad.','Papá Jorge paga 5 dinares de hospedaje en Damasco.','Mamá Isabel vende una Balanza de mercader en Isfahán.'];
function log(t){REG.unshift(t);REG.length=Math.min(REG.length,8);pintaReg()}
function pintaReg(){$('#regL').innerHTML=REG.map(t=>`<li>${t}</li>`).join('');$('#regN').textContent=$('#reg').classList.contains('abierto')?'▴':'▾'}
$('#bReg').onclick=()=>{const r=$('#reg');r.classList.toggle('abierto');$('#bReg').setAttribute('aria-expanded',r.classList.contains('abierto'));pintaReg()};
let tt=0;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('v');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('v'),2600)}
/* ---------- Menú de personajes y mano ---------- */
const ETQ=['Saber','Labia','Fuerza','Poesía','Astucia'];let abierto=1;
function pintaPers(){$('#persL').innerHTML=D.pj.map(p=>`<section class="acor${abierto===p.id?' ab':''}${p.yo?' yo':''}"><button data-p="${p.id}" aria-expanded="${abierto===p.id}"><svg class="spr" viewBox="0 0 120 200"><use href="#sp${p.sp}"/></svg><span class="nom">${p.jug}${p.yo?' (tú)':''} · ${p.nombre}</span><span class="chip"><svg><use href="#ic-d"/></svg>${p.din} din.</span><span class="chip"><svg><use href="#ic-n"/></svg>${fmt(p.noc)} noches</span><span class="chip${p.est==='Sano'||p.est==='Sana'?'':' mal'}">${p.est}</span></button>${abierto===p.id?`<div class="hoja"><h3>${p.nombre}<span class="ar" lang="ar">${p.ar}</span></h3><p class="it">${p.tit} · en ${p.ciudad}</p><ul class="pips">${p.st.map((n,i)=>`<li>${ETQ[i]}<i>${[0,1,2,3,4].map(k=>`<b class="${k<n?'on':''}"></b>`).join('')}</i></li>`).join('')}</ul><p class="it">${p.cita}</p></div>`:''}</section>`).join('');
$$('#persL .acor>button').forEach(b=>b.onclick=()=>{abierto=abierto===+b.dataset.p?0:+b.dataset.p;pintaPers()})}
const cierraPanel=id=>{const p=$('#'+id);p.hidden=true;(id==='pPers'?$('#bPers'):$('#bMano')).setAttribute('aria-expanded',false);(id==='pPers'?$('#bPers'):$('#bMano')).classList.remove('on')};
function panel(id,btn){const p=$('#'+id),abre=p.hidden;['pPers','pMano'].forEach(cierraPanel);if(abre){p.hidden=false;btn.setAttribute('aria-expanded',true);btn.classList.add('on')}}
$('#bPers').onclick=()=>{pintaPers();panel('pPers',$('#bPers'))};$('#bMano').onclick=()=>panel('pMano',$('#bMano'));
$$('[data-cierra]').forEach(b=>b.onclick=()=>cierraPanel(b.dataset.cierra));
/* ---------- Cartas bajo demanda ---------- */
const IC={historico:'<path d="M4 20h16M6 20V9l6-5 6 5v11M10 20v-6h4v6"/>',mensaje:'<path d="M4 7h16v10H4zM4 7l8 6 8-6"/>',trivia:'<path d="M9.5 9a2.5 2.5 0 115 0c0 2-2.5 2-2.5 4M12 17.5v.5M3 12a9 9 0 1018 0 9 9 0 10-18 0"/>',objeto:'<path d="M6 9l2-4h8l2 4v11H6zM9 9h6"/>'};
const ico=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[d]}</svg>`;
const ET={historico:'HISTORIA',mensaje:'MENSAJE',trivia:'CUENTO',objeto:'OBJETO'};
function mini(d){return`<div class="carta tam-mini deck-${d.deck}" role="img" aria-label="${ET[d.deck]}: ${d.titulo}"><span class="mini-ico">${ico(d.deck)}</span><span class="mini-tit">${d.titulo}</span><span class="mini-pie">${d.valor!=null?d.valor+' din.':ET[d.deck]}</span></div>`}
function crearCarta(d,gana){const a=mk('article','carta tam-completa deck-'+d.deck);a.dataset.id=d.id;a.setAttribute('aria-label',`${ET[d.deck]}: ${d.titulo}`);
a.innerHTML=`<header class="c-cab"><span class="c-ico">${ico(d.deck)}</span><h3 class="c-tit">${d.titulo}</h3></header>${d.sub?`<p class="c-sub">${d.sub}</p>`:''}<figure class="c-arte">${D.arte[d.arte]}</figure><div class="c-pill">${ET[d.deck]}</div><div class="c-cuerpo"><p class="c-texto">${d.texto}</p>${d.opc?`<div class="opciones">${d.opc.map((o,i)=>`<button class="opcion" data-o="${i}">${o}</button>`).join('')}</div><p class="c-nota" hidden></p>`:''}${d.nota?`<p class="c-nota">${d.nota}</p>`:''}</div>${d.cita?`<p class="c-cita">${d.cita}</p>`:''}<div class="chips-c">${d.chips.map(x=>`<span class="chip-c">${x}</span>`).join('')}</div>`;
if(d.opc)$$('.opcion',a).forEach(b=>b.onclick=()=>{const ok=+b.dataset.o===d.ok;$$('.opcion',a).forEach((x,i)=>{x.disabled=true;if(i===d.ok)x.classList.add('ok')});if(!ok)b.classList.add('mal');const n=$('.c-nota',a);n.hidden=false;n.textContent=(ok?'¡Correcto! ':'No era esa. ')+d.expl;
if(ok&&gana){yo().din+=d.premio;stats(true);log(`${yo().jug} acierta la trivia y gana ${d.premio} dinares.`)}});
return a}
let modal=null,ultima=null,idxC=-1;
function abrirCarta(d,consulta){if(modal)return;const f=mk('div','modal-fondo');f.setAttribute('role','dialog');f.setAttribute('aria-modal','true');f.setAttribute('aria-label',d.titulo);
f.innerHTML=`<div class="modal-carta"><div class="modal-sup">${consulta?'Consulta: sin cuenta atrás':'Para toda la mesa'}</div>${consulta?'':'<div class="barra-lectura" role="progressbar" aria-label="Tiempo mínimo de lectura" aria-valuemin="0" aria-valuemax="5"><i></i></div>'}<div class="carta-caja"></div><div class="modal-pie"><button class="btn modal-cerrar"></button></div></div>`;
$('.carta-caja',f).appendChild(crearCarta(d,!consulta));LZ.appendChild(f);modal=f;
const b=$('.modal-cerrar',f);let ok=consulta;
const cerrar=()=>{if(!ok)return;clearInterval(iv);f.remove();modal=null;document.removeEventListener('keydown',tecla);
if(!consulta){ultima=d;$('#bUlt').disabled=false;$('#bUlt').title='Volver a ver la última carta';log(`Se cierra la carta «${d.titulo}».`)}};
const tecla=e=>{if(e.key==='Escape')cerrar()};document.addEventListener('keydown',tecla);
let iv=0;const t0=performance.now();
if(consulta){b.textContent='Cerrar';b.focus()}else{b.disabled=true;
const tick=()=>{const r=Math.max(0,Math.ceil((5000-(performance.now()-t0))/1000));$('.barra-lectura',f).setAttribute('aria-valuenow',5-r);if(r>0)b.textContent=`Leyendo… ${r}`;else{clearInterval(iv);ok=true;b.disabled=false;b.textContent='Cerrar';b.focus()}};tick();iv=setInterval(tick,150)}
b.onclick=cerrar;f.addEventListener('click',e=>{if(e.target===f)cerrar()})}
$('#bCarta').onclick=()=>{if(modal)return;idxC=(idxC+1)%D.cartas.length;const d=D.cartas[idxC];log(`${yo().jug} saca una carta: ${d.titulo}.`);abrirCarta(d,false)};
$('#bUlt').onclick=()=>{if(ultima)abrirCarta(ultima,true)};
/* ---------- Dados ---------- */
const PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,26],[72,26],[28,50],[72,50],[28,74],[72,74]]};
const cara=n=>`<svg viewBox="0 0 100 100" class="cara-svg" aria-hidden="true"><rect x="3" y="3" width="94" height="94" rx="16" fill="url(#dR)" stroke="#4a0a10" stroke-width="3"/><rect x="7" y="7" width="86" height="86" rx="13" fill="none" stroke="#f08a8f" stroke-opacity=".35" stroke-width="1.5"/>${PIPS[n].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8.4" fill="url(#dP)"/>`).join('')}</svg>`;
const ROT={1:'rotateX(0) rotateY(0)',2:'rotateX(-90deg) rotateY(0)',3:'rotateX(0) rotateY(-90deg)',4:'rotateX(0) rotateY(90deg)',5:'rotateX(90deg) rotateY(0)',6:'rotateX(0) rotateY(180deg)'};
const CARAS=[['translateZ(var(--m))',1],['rotateX(90deg) translateZ(var(--m))',2],['rotateY(90deg) translateZ(var(--m))',3],['rotateY(-90deg) translateZ(var(--m))',4],['rotateX(-90deg) translateZ(var(--m))',5],['rotateY(180deg) translateZ(var(--m))',6]];
const cubo=(n,i)=>`<div class="dado rueda" style="--i:${i}"><div class="dsom"></div><div class="dsal"><div class="dcub" style="--fin:${ROT[n]}">${CARAS.map(([t,k])=>`<div class="dcar" style="transform:${t}">${cara(k)}</div>`).join('')}</div></div></div>`;
$('#bDados').onclick=()=>{if(modal||$('.dados-mesa'))return;const bd=$('#bDados');bd.disabled=true;const vs=[1+Math.random()*6|0,1+Math.random()*6|0];
const dm=mk('div','dados-mesa',vs.map(cubo).join(''));mesa.appendChild(dm);
setTimeout(()=>{const m=mk('div','modal-fondo dados-modal');m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Resultado de los dados');
m.innerHTML=`<div class="dados-res panel"><p class="q">${yo().jug} · tirada de 2 dados</p><div class="dados-caras">${vs.map(cara).join('')}</div><p class="tot" role="status">Suma: ${vs[0]+vs[1]}</p><button class="btn">Cerrar para todos</button></div>`;
LZ.appendChild(m);$('.btn',m).focus({preventScroll:true});
$('.btn',m).onclick=()=>{m.remove();dm.remove();bd.disabled=false;log(`${yo().jug} tira 2 dados: ${vs[0]} + ${vs[1]} = ${vs[0]+vs[1]}.`)}},1850)};
$('#manoL').innerHTML=D.mano.map((d,i)=>`<button class="mano-carta" data-m="${i}" aria-label="Abrir ${d.titulo}"><div class="carta-caja">${mini(d)}</div></button>`).join('');
$$('#manoL .mano-carta').forEach(b=>b.onclick=()=>abrirCarta(D.mano[+b.dataset.m],true));
stats();pintaReg();pintaPers();
setTimeout(()=>toast('Arrastra el tablero, acerca con la rueda o pellizca; toca una ciudad para viajar.'),600);
window.__muestra={cartasEnDom:()=>$$('.carta.tam-completa').length,dadosEnDom:()=>$$('.dados-mesa .dado').length,vista:()=>({...v}),modo:()=>modo,irA,zoomEn,viajar,limites:lim};
})();

</script>

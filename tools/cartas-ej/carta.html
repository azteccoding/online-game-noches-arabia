<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Amiri:wght@700&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:744px;height:1039px;overflow:hidden;background:#f5f1e6}
.carta{position:absolute;inset:0;background:#f5f1e6;color:#2d2924}
.m1{position:absolute;left:12px;top:12px;right:12px;bottom:12px;border:3px solid #4a453d}
.m2{position:absolute;left:22px;top:22px;right:22px;bottom:22px;border:1.5px solid #8b8574}
.esq{position:absolute;width:22px;height:22px;background:#f3e9c8;border:1.5px solid #4a453d;transform:rotate(45deg)}
.titulo{position:absolute;left:40px;right:40px;top:34px;height:62px;display:flex;align-items:center;justify-content:center;
  font:900 46px/1 'Playfair Display',serif;letter-spacing:.04em;text-transform:uppercase;text-align:center;white-space:nowrap}
.sub{position:absolute;left:40px;right:40px;top:94px;text-align:center;font:italic 400 25px/1.2 Alegreya,serif;color:#4a4238}
.marco-img{position:absolute;left:37px;top:143px;width:671px;height:435px;border:2px solid #d8d0bb;padding:3px}
.img{width:100%;height:100%;border:2.5px solid #4a453d;overflow:hidden;position:relative;
  background:radial-gradient(ellipse at 50% 35%,#e9d9a8 0%,#c9ad72 55%,#7d6440 100%)}
.img img{width:100%;height:100%;object-fit:cover;object-position:50% 55%;display:block}
.img .pend{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 500 26px Alegreya,serif;color:#5b4a2e;opacity:.75}
.num{position:absolute;left:22px;top:142px;width:96px;height:96px;border-radius:50%;background:#2f2b6e;border:4px solid #d9c98f;
  box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 3px #2f2b6e,inset 0 0 0 5px #d9c98f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num b{font:900 15px/1 'Playfair Display',serif;letter-spacing:.12em;opacity:.85}
.num span{font:900 38px/1 'Playfair Display',serif;margin-top:2px}
.ico{position:absolute;right:22px;top:142px;width:96px;height:96px;border-radius:50%;background:#f4efdd;border:3px solid #d9c98f;box-shadow:0 3px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.pill{position:absolute;left:50%;top:568px;transform:translateX(-50%);height:50px;padding:0 26px;border:3px solid #4a453d;border-radius:26px;background:#f5f1e6;
  display:flex;align-items:center;gap:14px;white-space:nowrap}
.pill .t{font:700 21px/1 'Playfair Display',serif;letter-spacing:.2em}
.pill .ar{font:700 26px/1 Amiri,serif;color:#8a1c1c;margin-top:-4px}
.caja{position:absolute;left:44px;right:44px;top:636px;height:282px;border:1.5px solid #cfc6ab;background:#f3ebcf;padding:6px}
.caja-in{width:100%;height:100%;border:1.5px solid #cfc6ab;display:flex;flex-direction:column;justify-content:center;padding:12px 20px;overflow:hidden}
.texto{font:400 25px/1.28 Alegreya,serif;color:#2d2924}
.texto p+p{margin-top:.35em}
.regla{font:italic 400 21px/1.25 Alegreya,serif;color:#4a4238;margin-top:.45em}
.pie{position:absolute;left:38px;right:38px;top:936px;height:66px;display:flex;gap:10px}
.pie div{flex:1;border:2px solid #4a453d;border-radius:12px;background:#f3ebcf;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;text-align:center}
.pie small{font:700 14px/1 Alegreya,serif;letter-spacing:.18em;color:#6b6252}
.pie strong{font:700 21px/1.1 Alegreya,serif;margin-top:5px}
/* dorso */
.dorso .emb{position:absolute;left:172px;top:282px;width:400px;height:400px}
.dorso .nom{position:absolute;left:30px;right:30px;top:696px;text-align:center;font:900 52px/1.05 'Playfair Display',serif;letter-spacing:.03em}
.dorso .sub2{position:absolute;left:50px;right:50px;top:830px;text-align:center;font:italic 400 27px/1.3 Alegreya,serif;color:#4a4238}
.dorso .ciu{position:absolute;left:60px;right:60px;top:150px;text-align:center}
.dorso .ciu small{display:block;font:700 16px/1 Alegreya,serif;letter-spacing:.22em;color:#6b6252}
.dorso .ciu strong{display:block;font:700 30px/1.2 Alegreya,serif;margin-top:8px;color:#2f2b6e}
</style></head>
<body><div id="raiz"></div>
<script>
const ICONO = (t, c) => `<svg width="${t}" height="${t}" viewBox="0 0 100 100"><path d="M50 14c6 9 9 15 0 24c-9-9-6-15 0-24z" fill="${c}"/><path d="M14 58c6-8 24-12 40-11c14 1 22 4 26 9l12-7c2-1 4 1 3 3l-9 13c-4 9-18 15-36 15c-17 0-30-6-35-15c-1-3-2-5-1-7z" fill="none" stroke="${c}" stroke-width="6" stroke-linejoin="round"/><path d="M34 82h32l4 8H30z" fill="${c}"/><path d="M14 58q-6-4 0-9" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/></svg>`;
const esquinas = () => [[0,0],[1,0],[0,1],[1,1]].map(([x,y]) => `<div class="esq" style="${x?'right':'left'}:2px;${y?'bottom':'top'}:2px"></div>`).join('');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function frente(c, arte) {
  return `<div class="carta">${'<div class="m1"></div><div class="m2"></div>' + esquinas()}
  <div class="titulo" id="tit">${esc(c.titulo || 'Evento de jugador')}</div>
  <div class="sub">${esc(c.sub || 'Se lee a toda la mesa · al pagar alojamiento')}</div>
  <div class="marco-img"><div class="img">${arte ? `<img src="${arte}" style="object-position:${c.pos || '50% 55%'}">` : '<div class="pend">(aquí va la pintura EJ.png)</div>'}</div></div>
  <div class="num"${c.jorasan ? ' style="background:#7a2a1c;box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 3px #7a2a1c,inset 0 0 0 5px #d9c98f"' : ''}><b>EJ</b><span>${c.n}</span></div>
  <div class="ico">${ICONO(62,'#2f2b6e')}</div>
  <div class="pill"><span>${ICONO(28,'#2f2b6e')}</span><span class="t">EVENTO DE JUGADOR</span><span class="ar">حدث</span></div>
  <div class="caja"><div class="caja-in" id="caja"><div class="texto" id="txt">${c.texto.map(l => `<p>${esc(l)}</p>`).join('')}${c.regla.map(l => `<div class="regla">${esc(l)}</div>`).join('')}</div></div></div>
  <div class="pie"><div><small>MAZO</small><strong>Eventos de jugador ${c.id}</strong></div><div><small>SALE EN</small><strong id="ciu">${c.jorasan ? 'Jorasán, si no logras salir' : esc(c.ciudades || 'Cualquier ciudad')}</strong></div></div>
  </div>`;
}
function dorso(c) {
  return `<div class="carta dorso">${'<div class="m1"></div><div class="m2"></div>' + esquinas()}
  ${c.ciudades ? `<div class="ciu"><small>SOLO SALE EN</small><strong>${esc(c.ciudades)}</strong></div>` : ''}
  <svg class="emb" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6d9ad"/><stop offset="1" stop-color="#9a8a68"/></linearGradient></defs>
   <circle cx="200" cy="200" r="196" fill="none" stroke="url(#g)" stroke-width="7"/><circle cx="200" cy="200" r="182" fill="none" stroke="#cfc6ab" stroke-width="2"/>
   <rect x="48" y="48" width="304" height="304" fill="none" stroke="#cfc6ab" stroke-width="2"/><rect x="48" y="48" width="304" height="304" fill="none" stroke="#cfc6ab" stroke-width="2" transform="rotate(45 200 200)"/>
   <g transform="translate(95 95) scale(2.1)">${ICONO(100,'#33307a').replace(/<svg[^>]*>|<\/svg>/g,'')}</g></svg>
  <div class="nom">EVENTOS<br>DE JUGADOR</div>
  <div class="sub2">${c.jorasan ? 'Cartas de eventos de jugador (EJ)<br>Salen si no logras salir del Jorasán en tu turno' : c.ciudades ? 'Cartas de eventos de jugador (EJ)' : 'Cartas de eventos de jugador (EJ)<br>Salen en cualquier ciudad'}</div>
  </div>`;
}
window.pintar = async (c, cara, arte) => {
  document.getElementById('raiz').innerHTML = cara === 'dorso' ? dorso(c) : frente(c, arte);
  await document.fonts.ready;
  if (cara !== 'dorso') {
    const tit = document.getElementById('tit'); let f = 46;
    while (tit.scrollWidth > tit.clientWidth && f > 26) { f -= 1; tit.style.fontSize = f + 'px'; }
    const caja = document.getElementById('caja'), txt = document.getElementById('txt'); let s = 25;
    while (txt.scrollHeight > caja.clientHeight - 24 && s > 15) { s -= 0.5; txt.style.fontSize = s + 'px'; txt.querySelectorAll('.regla').forEach(r => r.style.fontSize = (s * .85) + 'px'); }
    const ciu = document.getElementById('ciu'); let k = 21;
    while (ciu.scrollHeight > 46 && k > 12) { k -= 0.5; ciu.style.fontSize = k + 'px'; }
    const imgs = [...document.images]; await Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    return { titulo: f, texto: s, ciudades: k };
  }
  return {};
};
</script></body></html>

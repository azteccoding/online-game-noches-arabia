    <!-- Pantalla de inicio (Jorge, 25 de noviembre): mientras el juego carga, en colores oscuros. Al cargar la página no tiene duración

    <style>
      @font-face { font-family: 'Marcellus SC'; src: url('/fonts/MarcellusSC.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Alegreya'; src: url('/fonts/Alegreya-Italic.woff2') format('woff2'); font-weight: 400 900; font-style: italic; font-display: swap; }
      #inicio { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6em; padding: 16px; text-align: center; background: radial-gradient(ellipse at center, #1d0709 0%, #0d0305 70%, #060102 100%); color: #b8913f; transition: opacity .25s ease-out; pointer-events: auto; }
      #inicio.fuera { opacity: 0; }
      #inicio h1 { margin: 0; font-family: 'Marcellus SC', Georgia, serif; font-weight: 400; font-size: clamp(30px, 8vw, 64px); letter-spacing: .06em; line-height: 1.1; color: #b8913f; }
      #inicio p { margin: 0; font-family: 'Alegreya', Georgia, serif; font-style: italic; font-size: clamp(15px, 3.4vw, 22px); color: #8a7350; letter-spacing: .03em; }
    </style>

    </script>
